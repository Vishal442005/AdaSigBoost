name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y g++ cmake libomp-dev
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pybind11 scikit-build-core pytest ruff mypy
          pip install --no-build-isolation -e ".[dev]"
      - name: Lint
        run: ruff check adasigboost tests
      - name: Type check
        run: mypy adasigboost
      - name: Run unit tests
        run: pytest
